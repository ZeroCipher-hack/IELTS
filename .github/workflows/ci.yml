name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        working-directory: backend
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        working-directory: backend
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py check

      - name: Tests
        working-directory: backend
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py test exams --verbosity 2

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      # frontend/pnpm-workspace.yaml sets a project-relative storeDir, so the
      # store must be resolved from inside frontend/ rather than the repo root.
      - name: Resolve pnpm store
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Resolve pnpm store
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Prepare database
        working-directory: backend
        env:
          DJANGO_DEBUG: '1'
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          # Listening seeds as a draft (it needs a real recording). The e2e
          # suite needs all four sections published to exercise a full sitting,
          # so the fixture command supplies placeholder audio. DEBUG only.
          python manage.py seed_e2e

      - name: Start backend
        working-directory: backend
        env:
          DJANGO_DEBUG: '1'
          EXAMS_OPEN_ACCESS: '1'
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health/ >/dev/null && exit 0
            sleep 2
          done
          echo "Backend did not become healthy in time" >&2
          exit 1

      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke suite
        working-directory: frontend
        env:
          BACKEND_URL: http://127.0.0.1:8000
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
