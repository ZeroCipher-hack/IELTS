services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ieltsqa
      POSTGRES_USER: ieltsqa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ieltsqa"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ieltsqa
      POSTGRES_USER: ieltsqa
      DJANGO_DEBUG: '0'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    depends_on: [backend]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_files:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
volumes:
  postgres_data:
  static_files:
  caddy_data:
  caddy_config:
